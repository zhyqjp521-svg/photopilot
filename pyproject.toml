[project]
name = "photopilot"
version = "0.2.1"
description = "照片筛选 / 追色 / 美化 —— 全本地流水线（cull → color-match → polish）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<5",
    "Pillow>=10.0",
    "rawpy>=0.18",
    "mediapipe==0.10.*",
    "onnxruntime>=1.17",
    "pywebview>=5.0",
]

[project.scripts]
photopilot = "photopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["photopilot*"]
