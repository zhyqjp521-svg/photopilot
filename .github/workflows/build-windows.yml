# 在 GitHub 云端（Windows 机器）自动构建 Windows x64 单文件程序。
#
# 触发方式：
#   - 推送到 main 分支自动触发
#   - 或在 GitHub 仓库页面 Actions 标签里手动 "Run workflow"
#
# 产物：Actions 运行详情页最下方 Artifacts 里的
#      PhotoPilot-windows-x64.zip（内含 PhotoPilot.exe，双击即用，免装 Python）

name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Verify package imports
        run: python -c "import photopilot; print('PhotoPilot', photopilot.__version__)"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Install browser regression dependency
        run: |
          npm init -y
          npm install --no-save playwright-core

      - name: Run frontend regression tests
        env:
          PLAYWRIGHT_CORE: '1'
        run: |
          node tests/frontend_regressions.cjs
          node tests/grouped_view_browser.cjs
          node tests/size_filter_browser.cjs
          node tests/review_workspace_browser.cjs
          node tests/brush_reliability_browser.cjs

      - name: Build PhotoPilot.exe
        run: python scripts/build_windows.py --allow-missing-aesthetic

      - name: Smoke-test packaged EXE with a real photo import
        shell: pwsh
        run: ./tests/windows_smoke.ps1

      - name: Preserve Windows smoke diagnostics
        if: failure()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'photopilot-smoke*')
          if ($reports) {
            New-Item -ItemType Directory -Force -Path dist\smoke-diagnostics | Out-Null
            foreach ($report in $reports) {
              Copy-Item $report.FullName -Destination dist\smoke-diagnostics -Recurse -Force
            }
          } else {
            throw 'No Windows smoke diagnostics directory was found'
          }

      - name: Show output
        run: dir dist

      - name: Package Windows build
        shell: pwsh
        run: |
          $version = python -c "import photopilot; print(photopilot.__version__)"
          Compress-Archive -Path dist\PhotoPilot.exe -DestinationPath "dist\PhotoPilot-$version-windows-x64.zip" -Force
          Get-FileHash "dist\PhotoPilot-$version-windows-x64.zip" -Algorithm SHA256 | Format-List

      - name: Upload Windows build
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPilot-windows-x64
          path: |
            dist/PhotoPilot-*-windows-x64.zip
            dist/PhotoPilot.exe
            dist/smoke-diagnostics/**
          if-no-files-found: error
          retention-days: 30
